# just a simple config file for testing
VERSION: 1.0
FOLDER: samplefolder 
TARGETS:
  A: targetA.pptx

INDEXING:
  # suffix 前の:が2個 :: になっているのがエラー
  # double colons '::' before suffix causes an error
  - INDEX: <A::_index>
    SOURCE: <A:_source>

GENERATING:
  - GENERATE: <A>
    SOURCE: <A:_source>
    INDEX:
      - <A:_index>
